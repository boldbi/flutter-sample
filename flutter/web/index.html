<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sampleproject">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sampleproject</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var serviceWorkerVersion = null;
  </script>

  <script type="text/javascript" src="https://cdn.boldbi.com/embedded-sdk/latest/boldbi-embed.js"></script>
</head>
<body onload="Init()">

<div id="viewer-section">
  <div id="dashboard"></div>
</div>

<script>
  var apiUrl = 'http://localhost:8080/api';
  var ServerUrl;
  var SiteIdentifier;
  var Environment;
  var DashboardId;

  async function Init() {
    try {
      // Fetch config from your backend endpoint (change URL if needed)
      const res = await fetch(apiUrl+'/getdetails');
      if (!res.ok) throw new Error('Failed to load config from backend');
      const config = await res.json();

      // Assign values from backend response
      ServerUrl = config.ServerUrl;
      SiteIdentifier = config.SiteIdentifier;
      Environment = config.Environment;
      DashboardId = config.DashboardId;

      // Request embed token from backend TokenGeneration endpoint
      const tokenRes = await fetch(apiUrl + '/TokenGeneration', { method: 'POST' });

      if (!tokenRes.ok) throw new Error('Failed to generate embed token');
      const access_token = await tokenRes.json();
      const embedToken = access_token;
      if (!embedToken) throw new Error('Embed token not found in TokenGeneration response');

      renderDashboard(DashboardId, embedToken);

    } catch (err) {
      console.error('Error initializing embed:', err);
    }
  }

  function renderDashboard(dashboardId, embedToken) {
    var server = ServerUrl;
    if (SiteIdentifier && SiteIdentifier.toString().trim() !== '') server = server.replace(/\/$/, '') + '/' + SiteIdentifier;

    var dashboard = BoldBI.create({
        serverUrl: server,
        dashboardId: dashboardId,
        environment: Environment,
        embedContainerId: "dashboard",
        embedToken: embedToken
    });
    dashboard.loadDashboard();
  }
</script>
</body>
</html>
